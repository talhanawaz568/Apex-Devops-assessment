name: Apex CI and Container Delivery

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

#####################################################
  quality:

    name: Lint and Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff Linting
        run: |
          ruff check app tests

      - name: Run Automated Tests
        run: |
          python -m pytest -v --junitxml=pytest-results.xml

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore


###########################################################
  build_and_scan:

    name: Build and Scan Container

    needs: quality

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --tag apex-ci:${{ github.sha }} \
            .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: apex-ci:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Archive Validated Docker Image
        run: |
          docker save \
            apex-ci:${{ github.sha }} \
            -o apex-image.tar

      - name: Upload Validated Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: validated-image
          path: apex-image.tar
          retention-days: 2
          compression-level: 0


##################################################
  publish:

    name: Publish Image to GHCR

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - quality
      - build_and_scan

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Download Validated Docker Image
        uses: actions/download-artifact@v4
        with:
          name: validated-image

      - name: Load Validated Docker Image
        run: |
          docker load -i apex-image.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Publish Docker Image
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          IMAGE="ghcr.io/${REPO,,}:sha-${SHA}"

          docker tag \
            "apex-ci:${SHA}" \
            "$IMAGE"

          docker push "$IMAGE"

          echo "Published image: $IMAGE"
